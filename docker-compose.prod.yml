# Production overlay for VPS/HTTPS deploys — self-sufficient (run alone, not as override):
#   docker compose -f docker-compose.prod.yml up -d --build
# Adds a Caddy edge container that serves HTTPS for the platform domain and
# every <slug>.<PLATFORM_DOMAIN> gym subdomain with on-demand TLS, plus a
# nightly database backup (./backups, keeps 14 days).
# Required .env values: PLATFORM_DOMAIN (e.g. example.com), CADDY_EMAIL,
# NODE_ENV=production, JWT_SECRET, POSTGRES_PASSWORD, BOOTSTRAP_ADMIN_*.

name: jaini-fitness

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gymdb}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  # nightly database backup (02:17 UTC each day), keeps the last 14 files
  db-backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-gym}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:-gymdb}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "nightly backup active — dumps to /backups, keeping 14"
        while true; do
          d=$(date -u +%F)
          pg_dump | gzip > "/backups/gymdb-$$d.sql.gz" && echo "backed up $$d"
          find /backups -name 'gymdb-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gymdb}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      APP_URL: ${APP_URL:-https://www.${PLATFORM_DOMAIN}}
      NODE_ENV: production
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set in .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-https://${PLATFORM_DOMAIN}}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: ./frontend
    expose:
      - "80"      # reached only by Caddy inside the compose network
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
  caddyconfig: