# Jaini Fitness Center — nginx
# member site + admin site on the same app, role decided after login

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name admin.jainifitness.test;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_up http://backend:3000;
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public"; }

    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name jainifitness.test localhost _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_up http://backend:3000;
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public"; }

    location / { try_files $uri /index.html; }
}