# nginx — one app for everyone (admin/member routing is decided by the logged-in role)

resolver 127.0.0.11 valid=10s ipv6=off;

# warm keepalive connections to the backend — handles bursts of parallel
# requests without a fresh TCP connect per call (scales to extra replicas)
upstream backend_pool {
    server backend:3000;
    keepalive 32;
}

# legacy admin subdomain → main site (single login now)
server {
    listen 80;
    server_name ~^admin\.(?<main_host>.+)$;
    return 301 http://$main_host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # compression — small text assets travel ~4x smaller over the tunnel
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public"; }

    location / { try_files $uri /index.html; }
}