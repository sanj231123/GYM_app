# nginx — one app for everyone (admin/member routing is decided by the logged-in role)

resolver 127.0.0.11 valid=10s ipv6=off;

# legacy admin subdomain → main site (single login now)
server {
    listen 80;
    server_name ~^admin\.(?<main_host>.+)$;
    return 301 http://$main_host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_up http://backend:3000;
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public"; }

    location / { try_files $uri /index.html; }
}