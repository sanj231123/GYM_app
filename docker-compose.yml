name: jaini-fitness

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym123}
      POSTGRES_DB: ${POSTGRES_DB:-gymdb}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD:-gym123}@db:5432/${POSTGRES_DB:-gymdb}
      JWT_SECRET: ${JWT_SECRET:-gymfit_dev_secret_change_me}
      APP_URL: ${APP_URL:-http://localhost:2311}
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"      # no port in the URL (http://jainifitness.test)
      - "2311:80"    # backup: old route (http://localhost:2311)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata: