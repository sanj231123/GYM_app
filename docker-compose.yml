name: jaini-fitness

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym123}
      POSTGRES_DB: ${POSTGRES_DB:-gymdb}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD:-gym123}@db:5432/${POSTGRES_DB:-gymdb}
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_only_jaini_fitness_0123456789}
      APP_URL: ${APP_URL:-http://localhost:2311}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:2311,http://jainifitness.test}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"      # no port in the URL (http://jainifitness.test)
      - "2311:80"    # backup: old route (http://localhost:2311)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata: