name: Deploy (self-hosted runner)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Pull latest code
        working-directory: /home/sanjayprajapati/gym-app
        run: git pull --ff-only origin main

      - name: Backup database before deploy
        working-directory: /home/sanjayprajapati/gym-app
        run: |
          mkdir -p backups
          ts=$(date +%Y%m%d-%H%M%S)
          docker compose exec -T db pg_dump -U gym gymdb > "backups/pre-deploy-$ts.sql" && echo "Saved backups/pre-deploy-$ts.sql" || echo "::warning::pg_dump failed — deploying anyway"
          ls -1t backups/pre-deploy-*.sql 2>/dev/null | tail -n +15 | xargs -r rm -f

      - name: Rebuild and restart containers
        working-directory: /home/sanjayprajapati/gym-app
        run: docker compose up -d --build

      - name: Health check
        if: always()
        run: sleep 5; curl -fsS http://localhost:2311/api/health || echo "::warning::Health check failed — check ./logs.sh backend"